[project]
name = "bingo-watcher"
version = "0.1.0"
description = "Watches Alpaca trade activity across a ticker watchlist and alerts on unusual trade-count spikes via Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "pydantic-settings>=2.6",
    "python-telegram-bot>=21.0",
    "pyyaml>=6.0",
]

[project.scripts]
bingo-watcher = "bingo_watcher.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
